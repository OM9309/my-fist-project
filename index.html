
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Student Registration</h2>

    <nav>
        <a href="#">Home</a>
        <a href="#table">Students</a>
        <a href="#form">Register</a>
    </nav>

    <h3 id="table">Student Information</h3>

    <table>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Course</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Amit</td>
            <td>IT</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Priya</td>
            <td>Computer</td>
        </tr>
    </table>

    <h3 id="form">Registration Form</h3>

    <form>
        Name:
        <input type="text" placeholder="Enter name" required>

        Email:
        <input type="email" placeholder="Enter email" required>

        Course:
        <select>
            <option>IT</option>
            <option>Computer</option>
            <option>AI & DS</option>
        </select>

        <input type="submit" value="Register">
    </form>

</body>
</html>
